[project]
name = "parch"
version = "0.3.0a0"
description = "parch — fixed e-ink PDF pages (fpdf2 / Nomad)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
  { name = "Joseph Chiocchi", email = "joe@yolk.cc" },
]
keywords = ["e-ink", "planner", "supernote", "fpdf2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
]
dependencies = [
    "fpdf2==2.8.5",
]

[project.urls]
Homepage = "https://github.com/yyolk/parch"
Repository = "https://github.com/yyolk/parch"
Issues = "https://github.com/yyolk/parch/issues"

[project.scripts]
parch = "parch.press:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parch"]

[tool.hatch.build.targets.wheel.force-include]
"src/parch/fonts" = "parch/fonts"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pypdf>=6.16.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
