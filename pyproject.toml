[project]
name = "planner"
version = "0.0.0"
description = "Throwaway fpdf2 yearly planner spike v2 (not parch)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "spike", email = "spike@example.invalid" },
]
keywords = ["e-ink", "planner", "fpdf2", "pdf"]
dependencies = [
  "fpdf2>=2.8.5",
]

[project.optional-dependencies]
dev = ["pypdf>=5.0"]

[project.scripts]
press = "planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]
