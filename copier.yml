# Exploratory L: this repo is a copier src. Render templates/starter only.
# Interactive use: copier copy gh:yyolk/parch dest
# Wrapper: parch init --template  (optional extra: pip install 'parch[template]')
_subdirectory: templates/starter
_min_copier_version: "9.6.0"
_message_after_copy: |
  Wrote parch.toml. Press it with:
    parch press parch.toml -o out.pdf

starter:
  type: str
  help: Which starter TOML to emit
  # Copier dict form is {label: value}.
  choices:
    Nomad year planner: nomad
    Kindle Scribe year planner: scribe
    Nomad + optional extras: extras
    Bullet journal: bujo
    Projects notebook: projects
    Engineering notebook: engineering
    Gregg steno pad: steno
  default: nomad

year:
  type: int
  help: Calendar year
  default: 2026

device:
  type: str
  help: Slate id
  choices:
    SuperNote Nomad: supernote-nomad
    Kindle Scribe: kindle-scribe
  default: "{% if starter == 'scribe' %}kindle-scribe{% else %}supernote-nomad{% endif %}"
