# Single-face Gregg stenographer pad.
# Dotted Gregg ⅓″ + one center rule, inset like the SuperNote steno PNG. No frame.
# No steno-notebook book yet — ``steno_sheets > 0`` presses this
# section only:
#   parch press examples/steno-pad.toml -o out/steno-pad.pdf
device = "supernote-nomad"
title = "Steno pad"

[steno]
sheets = 1
