# Single-page Gregg stenographer pad (S2 draft).
# ≈⅓″ horizontals + heavier center vertical in content_frame.
# PDF is the device page — not a literal 6×9.
# No steno-notebook book — ``steno_pages > 0`` presses this section only:
#   parch press examples/steno.toml -o out/steno.pdf
year = 2026
device = "supernote-nomad"
title = "Gregg"

[steno]
pages = 1
