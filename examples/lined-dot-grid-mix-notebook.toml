# Lined / dot-grid mix notebook — cover, then duplex pair sheets.
# Each sheet is front + back (name is front then back). Either type
# or both: default walk is lined-dot-grid, then dot-grid-lined.
# Not pad-only: examples/lined-dot-grid-pad.toml (no cover).
# Alias book id ``lined-dotgrid-notebook`` still loads this mix book.
#   parch press examples/lined-dot-grid-mix-notebook.toml -o out/lined-dot-grid-mix-notebook.pdf
book = "lined-dot-grid-mix-notebook"
year = 2026
device = "supernote-nomad"
title = "Lined / Dot grid"
# Reader sidebar outline (bookmarks). Cover and pad faces are skipped. Default is false.
outline = true

[lined-dot-grid]
sheets = 6
