# front + back (name is front then back). Pad-only (no cover):
# examples/lined-dot-grid-pad.toml.
#   parch press examples/lined-dot-grid-mix-notebook.toml -o out/lined-dot-grid-mix-notebook.pdf
book = "lined-dot-grid-mix-notebook"
year = 2026
device = "supernote-nomad"
