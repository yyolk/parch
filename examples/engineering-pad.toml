# Duplex engineering / computation pad (section only, no cover).
# Front = SUBJECT|DATE|SHEET boxes + empty well; back = 5×5 grid.
# ``year-planner`` + ``engineering_sheets > 0`` still presses this section
# alone. Sibling book (cover + N sheets): examples/engineering-notebook.toml
#   parch press examples/engineering-pad.toml -o out/engineering-pad.pdf
year = 2026
device = "supernote-nomad"
title = "Engineering pad"

[engineering]
sheets = 1
