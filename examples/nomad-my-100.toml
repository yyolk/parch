# Exploratory My 100 — off in the year-planner default.
# Walk when on: cover → annual → my 100 → (optional checkoff) → Q1 → January + habits → …
#   parch press examples/nomad-my-100.toml -o out/nomad-my-100.pdf
year = 2026
device = "supernote-nomad"
week_start = "monday"
months = [1]
title = "Year planner"
outline = true
my_100 = true

[daily]
schedule_from = 7
schedule_to = 16
notes_pages = 0
priority_rows = 6

[habits]
columns = 10

[projects]
cards = 3
tasks = 4
tickets = 8
index_pages = 1

[meetings]
index_rows = 16

[tasks]
rows = 6
