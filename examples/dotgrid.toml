# Single-face edge-to-edge clone-dot page. Pad-only — no cover.
# Sibling book (cover + sheets): examples/dotgrid-notebook.toml.
# Full-bleed page rect, CLONE_DOT_PITCH / CLONE_DOT. ``dotgrid_sheets > 0``
# presses this ledger (appends after engineering / steno when those
# counts are also set):
#   parch press examples/dotgrid.toml -o out/dotgrid.pdf
device = "supernote-nomad"
title = "Dot grid"

[dotgrid]
sheets = 1
