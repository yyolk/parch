# Lined / dot-grid notebook — cover, then lined, dot, lined, dot, …
# Reuses lined_pages + dotgrid_pages (no nested Spec). Lined starts
# (odd body pages lined, even body pages dot-grid). Unequal counts
# append leftover faces after the last pair.
#   parch press examples/lined-dotgrid-notebook.toml -o out/lined-dotgrid-notebook.pdf
# Pad-only lined: examples/lined-pad.toml. Lined book: examples/lined-notebook.toml.
book = "lined-dotgrid-notebook"
year = 2026
device = "supernote-nomad"
title = "Lined / Dot grid"
# Reader sidebar outline (bookmarks). Cover and pad faces are skipped. Default is false.
outline = true

[lined]
sheets = 6

[dotgrid]
sheets = 6
