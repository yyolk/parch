# Nomad year planner walk — cover → annual → (optional extras: checkoff, favorites, my 100) → Q1–Q4 → each month + habits → each touching ISO week once → days + notes → review → projects index/dests → meetings → tasks.
# Optional extras stay off here; see examples/nomad-extras.toml.
# notes_pages = 1 keeps the year artifact smaller; 2 still works.
year = 2026
device = "supernote-nomad"
week_start = "monday"
months = { from = 1, to = 12 }
title = "Year planner"
# Reader sidebar outline (bookmarks). Cover is skipped.
outline = true

[daily]
schedule = { from = 07:00:00, to = 16:00:00 }
notes_pages = 1
priority_rows = 6

[habits]
columns = 10

[projects]
cards = 3
tickets = 8
index_pages = 3

[meetings]
index_rows = 16

[tasks]
rows = 6
