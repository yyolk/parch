# Both pads, no cover: duplex engineering faces then Gregg steno.
# [dotgrid] also concatenates after those on year-planner (see
# examples/dotgrid-pad.toml). engineering-notebook cannot set it.
#   parch press examples/pads.toml -o out/pads.pdf
device = "supernote-nomad"
title = "Pads"

[engineering]
sheets = 1

[steno]
sheets = 1
