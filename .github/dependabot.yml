# Dependabot: GitHub Actions, uv (pyproject.toml + uv.lock), and
# .devcontainer/Dockerfile images (Astral uv pin + Microsoft base).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns:
          - "*"
