name: Release PDFs
run-name: Release PDFs ${{ inputs.release_tag || github.ref_name }} ${{ github.event_name == 'workflow_dispatch' && inputs.device_set || 'hero' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing Release tag to attach PDFs (empty = press only, job artifacts)"
        required: false
        type: string
      max_parallel:
        description: "Override matrix max-parallel (default: shard count)"
        required: false
        type: number
      device_set:
        description: "hero (release default) or all known devices"
        required: false
        type: choice
        options:
          - hero
          - all
        default: hero

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.devices.outputs.shards }}
      max_parallel: ${{ steps.devices.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv sync --group dev
      - id: devices
        run: |
          SET="${{ github.event_name == 'workflow_dispatch' && inputs.device_set || 'hero' }}"
          if [ "$SET" = "all" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "device_set=all is not allowed on release:published (hero only)" >&2
              exit 1
            fi
            TAG="${{ inputs.release_tag }}"
            if [ -n "$TAG" ]; then
              echo "device_set=all cannot attach to a Release (release_tag=$TAG). Use empty release_tag for timing, or device_set=hero to upload." >&2
              exit 1
            fi
          fi
          MATRIX="$(uv run python -m parch.services.release_pdfs "$SET")"
          {
            echo "shards<<EOF"
            printf '%s\n' "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          WIDTH="$(printf '%s' "$MATRIX" | uv run python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.max_parallel }}" ]; then
            echo "max_parallel=${{ inputs.max_parallel }}" >> "$GITHUB_OUTPUT"
          else
            echo "max_parallel=$WIDTH" >> "$GITHUB_OUTPUT"
          fi

  pdf:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv sync --group dev
      - name: Resolve version and names
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.release_tag }}"
          fi
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="$(uv run python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          pdf="parch-${version}-${DEVICE}.pdf"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
      - name: Press PDF
        run: |
          test "$DEVICE" = supernote-nomad
          uv run parch press examples/mvp.toml -o "${{ steps.meta.outputs.pdf }}"
          test -s "${{ steps.meta.outputs.pdf }}"
      - name: Attach to Release
        if: github.event_name == 'release' || (inputs.release_tag != '' && inputs.device_set != 'all')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.pdf }}" --clobber
      - name: Upload job artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.pdf }}
          path: ${{ steps.meta.outputs.pdf }}
      - name: Drop local PDF
        if: always() && steps.meta.outputs.pdf != ''
        run: rm -f "${{ steps.meta.outputs.pdf }}"
