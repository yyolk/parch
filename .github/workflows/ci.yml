# Spike CI only — old Typst/parch jobs are gone on this branch.
# This workflow is intentionally tiny. Failures here should not be
# treated as product CI. DO NOT MERGE this branch.

name: CI

on:
  pull_request:
  push:

jobs:
  generate-specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spike package
        run: pip install -e .
      - name: Generate specimen PDF
        run: press --specimen -o artifacts/ci-specimen.pdf
      - name: Specimen is non-empty
        run: test -s artifacts/ci-specimen.pdf
