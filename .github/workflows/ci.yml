name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
      - name: Press Nomad
        run: |
          uv run parch press examples/nomad.toml -o out/nomad.pdf
          test -s out/nomad.pdf

  # Nomad + Scribe catalog. PR events stay test-only. workflow_dispatch uploads
  # one dry-run artifact; push to the default branch deploys Pages. No product-PDF upload.
  pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --group dev
      - name: Build specimen catalog
        run: |
          uv run parch specimen -w out
          test -s out/specimens/index.html
          grep -q "github.com/.*/commit/" out/specimens/index.html
          devices=$(uv run python -c 'from parch.specimen import CATALOG_DEVICE_IDS; print(" ".join(CATALOG_DEVICE_IDS))')
          for device in $devices; do
            grep -q "href=\"$device/\"" out/specimens/index.html
            test -s out/specimens/$device/cover.png
            test -s out/specimens/$device/index.html
            test -s out/specimens/$device/projects-cover.png
            test -s out/specimens/$device/projects-index.png
            test -s out/specimens/$device/projects-project-1.png
            test -s out/specimens/$device/bujo-cover.png
            test -s out/specimens/$device/bujo-key.png
            test -s out/specimens/$device/bujo-index.png
            test -s out/specimens/$device/bujo-future.png
            test -s out/specimens/$device/steno.png
            test -s out/specimens/$device/dotgrid.png
            test -s out/specimens/$device/lined.png
            test -s out/specimens/$device/perspective.png
            test -s out/specimens/$device/dotgrid-cover.png
            test -s out/specimens/$device/dotgrid-page.png
            test -s out/specimens/$device/lined-cover.png
            test -s out/specimens/$device/lined-page.png
            test -s out/specimens/$device/perspective-cover.png
            test -s out/specimens/$device/perspective-page.png
            test -s out/specimens/$device/lined-dotgrid-cover.png
            test -s out/specimens/$device/lined-dotgrid-lined.png
            test -s out/specimens/$device/lined-dotgrid-dotgrid.png
            test -s out/specimens/$device/engineering-cover.png
            test -s out/specimens/$device/favorites.png
            test -s out/specimens/$device/my-100.png
            test -s out/specimens/$device/checkoff-365.png
            grep -q 'src="cover.png"' out/specimens/$device/index.html
            grep -q 'src="projects-cover.png"' out/specimens/$device/index.html
            grep -q 'src="projects-project-1.png"' out/specimens/$device/index.html
            grep -q 'src="bujo-cover.png"' out/specimens/$device/index.html
            grep -q 'src="bujo-key.png"' out/specimens/$device/index.html
            grep -q 'src="bujo-future.png"' out/specimens/$device/index.html
            grep -q 'src="steno.png"' out/specimens/$device/index.html
            grep -q 'src="dotgrid.png"' out/specimens/$device/index.html
            grep -q 'src="lined.png"' out/specimens/$device/index.html
            grep -q 'src="perspective.png"' out/specimens/$device/index.html
            grep -q 'src="dotgrid-cover.png"' out/specimens/$device/index.html
            grep -q 'src="dotgrid-page.png"' out/specimens/$device/index.html
            grep -q 'src="lined-cover.png"' out/specimens/$device/index.html
            grep -q 'src="lined-page.png"' out/specimens/$device/index.html
            grep -q 'src="perspective-cover.png"' out/specimens/$device/index.html
            grep -q 'src="perspective-page.png"' out/specimens/$device/index.html
            grep -q 'src="lined-dotgrid-cover.png"' out/specimens/$device/index.html
            grep -q 'src="lined-dotgrid-lined.png"' out/specimens/$device/index.html
            grep -q 'src="lined-dotgrid-dotgrid.png"' out/specimens/$device/index.html
            grep -q 'src="favorites.png"' out/specimens/$device/index.html
            grep -q 'src="my-100.png"' out/specimens/$device/index.html
            grep -q 'src="checkoff-365.png"' out/specimens/$device/index.html
            grep -q '<input type="checkbox" id="cover">' out/specimens/$device/index.html
            grep -q 'input:checked+label img' out/specimens/$device/index.html
            grep -q 'id="year-planner"' out/specimens/$device/index.html
            grep -q 'id="optional-extras"' out/specimens/$device/index.html
            grep -q 'id="engineering-notebook"' out/specimens/$device/index.html
            grep -q 'id="projects-notebook"' out/specimens/$device/index.html
            grep -q 'id="bullet-journal"' out/specimens/$device/index.html
            grep -q 'id="dotgrid-notebook"' out/specimens/$device/index.html
            grep -q 'id="lined-notebook"' out/specimens/$device/index.html
            grep -q 'id="perspective-notebook"' out/specimens/$device/index.html
            grep -q 'id="lined-dotgrid-mix-notebook"' out/specimens/$device/index.html
            grep -q 'id="steno-pad"' out/specimens/$device/index.html
            grep -q 'id="dotgrid-pad"' out/specimens/$device/index.html
            grep -q 'id="lined-pad"' out/specimens/$device/index.html
            grep -q 'id="perspective-pad"' out/specimens/$device/index.html
            grep -q 'href="#year-planner"' out/specimens/$device/index.html
            grep -q 'href="#optional-extras"' out/specimens/$device/index.html
            grep -q 'href="#bullet-journal"' out/specimens/$device/index.html
            grep -q '<h2>Optional extras</h2>' out/specimens/$device/index.html
            grep -q '<h2>Projects notebook</h2>' out/specimens/$device/index.html
            grep -q '<h2>Bullet Journal</h2>' out/specimens/$device/index.html
            grep -q '<h2>Dotgrid notebook</h2>' out/specimens/$device/index.html
            grep -q '<h2>Lined notebook</h2>' out/specimens/$device/index.html
            grep -q '<h2>Perspective notebook</h2>' out/specimens/$device/index.html
            grep -q '<h2>Lined / dotgrid mix notebook</h2>' out/specimens/$device/index.html
            grep -q '<h2>Dotgrid pad</h2>' out/specimens/$device/index.html
            grep -q '<h2>Lined pad</h2>' out/specimens/$device/index.html
            grep -q '<h2>Perspective pad</h2>' out/specimens/$device/index.html
            grep -q "github.com/.*/commit/" out/specimens/$device/index.html
            ! grep -q '<script' out/specimens/$device/index.html
            ! grep -q 'href="cover.png"' out/specimens/$device/index.html
            test ! -e out/specimens/$device/specimen.pdf
          done
      - name: Upload catalog (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: specimens
          path: out/specimens
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          path: out/specimens

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
