name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - run: uv python install 3.14
      - run: uv sync --group dev
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - run: uv run pytest
      - name: Press Nomad MVP
        run: |
          uv run parch press examples/mvp.toml -w out/nomad -o out/nomad.pdf
          test -s out/nomad/index.pdf
          test -s out/nomad.pdf

  # One Nomad catalog path. PR events stay test-only. workflow_dispatch uploads
  # one dry-run artifact; push to master deploys Pages. No product-PDF upload.
  pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [test]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv python install 3.14
      - run: uv sync --group dev
      - name: Build Nomad specimen catalog
        run: |
          uv run parch specimen supernote-nomad -w out
          uv run python -c 'from pathlib import Path; from parch.specimen import write_catalog_index; write_catalog_index(Path("out/specimens"), ("supernote-nomad",))'
          test -s out/specimens/index.html
          test -s out/specimens/supernote-nomad/cover.png
          test -s out/specimens/supernote-nomad/index.html
          test ! -e out/specimens/supernote-nomad/specimen.pdf
      - name: Upload catalog (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: specimens
          path: out/specimens
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: out/specimens

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
