name: Press Scribe band
run-name: Press Scribe edge + side-depth probes

on:
  workflow_dispatch:
  push:
    branches: [press-scribe-os-band, press-scribe-edge-probe]

permissions:
  contents: read

jobs:
  press:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - run: uv sync --group dev
      - name: Press side-depth probe
        run: |
          mkdir -p out
          uv run python scripts/scribe_side_depth_probe.py -o out/scribe-side-depth-probe.pdf
          test -s out/scribe-side-depth-probe.pdf
      - name: Press edge probe
        run: |
          uv run python scripts/scribe_edge_probe.py -o out/scribe-edge-probe.pdf
          test -s out/scribe-edge-probe.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scribe-side-depth-press
          path: |
            out/scribe-side-depth-probe.pdf
            out/scribe-edge-probe.pdf
          if-no-files-found: error
